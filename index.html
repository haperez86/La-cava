<style>
:root{--green:#10271f;--green2:#19392e;--gold:#c6a16a;--cream:#f7f4ed;--ink:#202821;--muted:#778078;--line:#e6e8e2;--white:#fff;--red:#b84d43;--amber:#c28a35;--shadow:0 8px 28px #14251a12}
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--green);color:#f8f5ed;padding:24px 16px;display:flex;flex-direction:column;gap:26px}.brand{padding:8px 10px 20px;border-bottom:1px solid #ffffff20}.brand-mark{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:21px;margin-bottom:12px}.brand h1{font:600 21px Georgia,serif;letter-spacing:3px;margin:0;color:#e4c38e}.brand p{margin:4px 0 0;color:#c9cfc8;font-size:10px;letter-spacing:4px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dce4dc;text-align:left;padding:12px 14px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff16;color:#f1d39f}.nav .ico{width:20px;text-align:center}.side-foot{margin-top:auto;color:#b9c6bc;font-size:12px;padding:10px}.main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.topbar .crumb{color:var(--muted);font-size:13px}.user{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8ddc8;color:var(--green);display:grid;place-items:center;font-weight:700}.content{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}.eyebrow{color:#9a7746;text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700}.page-head h2{font:600 29px Georgia,serif;margin:4px 0}.sub{color:var(--muted);margin:0;font-size:13px}.btn{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:9px;color:var(--ink);font-weight:600}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.gold{background:var(--gold);border-color:var(--gold);color:#17251d}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:26px;font-weight:700;margin:6px 0}.stat-note{font-size:11px;color:#718276}.layout2{grid-template-columns:1.35fr 1fr}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-title h3{font:600 18px Georgia,serif;margin:0}.table-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.table-tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:white;text-align:left;min-height:116px;display:flex;flex-direction:column;gap:8px}.table-tile.occupied{border-color:#d9bd8f;background:#fffdf8}.table-tile .num{font-size:21px;font-weight:700}.table-tile .meta{font-size:11px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700;background:#edf2ed;color:#3f7454}.pill.busy{background:#fff1d9;color:#96651e}.pill.ready{background:#e7eff8;color:#456b91}.pill.danger{background:#fbe9e6;color:#a4473d}.list{display:grid;gap:10px}.order-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.order-row:last-child{border:0}.order-row strong{display:block;font-size:13px}.order-row small{color:var(--muted)}.money{font-weight:700;white-space:nowrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field select{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 11px;min-width:0}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:650;color:#536057}.field input,.field select{width:100%}.menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white}.product-art{height:112px;background:linear-gradient(135deg,#19392e,#385b48);display:grid;place-items:center;font-size:42px}.product-body{padding:13px}.product-body h4{margin:0 0 4px;font-size:14px}.product-body p{margin:0 0 10px;color:var(--muted);font-size:11px}.product-foot{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:white;border-radius:99px;padding:7px 12px;font-size:12px}.tab.active{background:var(--green);color:white;border-color:var(--green)}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:570px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:600;background:#fafbf9}tr:last-child td{border:0}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.modal-back{position:fixed;inset:0;background:#0b1712a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.show{display:flex}.modal{background:white;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 70px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{font:600 21px Georgia,serif;margin:0}.close{border:0;background:#f0f2ef;border-radius:50%;width:32px;height:32px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cart-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid var(--line);background:white;border-radius:6px;width:25px;height:25px}.total-line{display:flex;justify-content:space-between;padding:14px 0;font-size:17px;font-weight:750}.notice{background:#f8f3e9;border:1px solid #ead9b9;border-radius:10px;padding:12px;color:#6f5938;font-size:12px;margin-top:14px}.mobile-nav{display:none}.kitchen-card{border-left:4px solid var(--amber)}.kitchen-card.ready-card{border-left-color:#538d69}.kitchen-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hide{display:none!important}
@media print{
 body{background:#fff!important}.sidebar,.topbar,.mobile-nav,.page-head .btn,.modal-back,.no-print{display:none!important}
 .app{display:block}.content{padding:0;max-width:none}.card,.table-wrap{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.table-grid{grid-template-columns:repeat(3,1fr)}.menu-grid{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}.kitchen-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{display:block;padding-bottom:76px}.sidebar{display:none}.topbar{height:60px;padding:0 16px}.topbar .crumb{display:none}.content{padding:22px 16px}.page-head{margin-bottom:20px}.page-head h2{font-size:25px}.page-head .btn{font-size:11px;padding:9px}.stats{gap:12px}.card{padding:16px}.stat-value{font-size:22px}.table-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.table-tile{min-height:105px;padding:12px}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product-art{height:86px}.product-body{padding:12px}.product-body h4{font-size:12px}.product-body p{font-size:10px}.kitchen-grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:#68746b;font-size:10px;display:grid;gap:4px;justify-items:center;min-width:52px;padding:5px 2px;min-height:48px}.mobile-nav button.active{color:var(--green);font-weight:700}.mobile-nav span{font-size:18px}.user .user-name{display:none}.modal-back{align-items:flex-end;padding:0}.modal{border-radius:17px 17px 0 0;max-height:92vh;padding:19px 16px calc(18px + env(safe-area-inset-bottom))}.toolbar input{flex:1;width:100%}.page-head{align-items:center}.table-wrap{border-radius:9px}th,td{padding:11px 10px}}
@media(max-width:700px){.btn{min-height:42px}.field{margin:15px 0}.field input,.field select{min-height:44px}.order-row{padding:14px 0}.section-title{gap:10px;align-items:flex-start}.table-tile{gap:10px}.card+.card{margin-top:2px}.modal-actions{flex-wrap:wrap}.modal-actions .btn{flex:1}}
@media(max-width:380px){.content{padding:18px 12px}.stats{grid-template-columns:repeat(2,1fr)}.stat-value{font-size:19px}.table-grid{grid-template-columns:repeat(2,1fr)}.menu-grid{grid-template-columns:1fr 1fr}.page-head h2{font-size:22px}}

/* Ajustes de usabilidad móvil: botones con espacio, ancho y jerarquía consistentes */
@media(max-width:700px){
  .page-head{display:flex;flex-direction:column;align-items:stretch;gap:12px}
  .page-head>div{width:100%;min-width:0}
  .page-head>.btn,.page-head button{width:100%;min-height:44px;font-size:13px;padding:11px 14px}
  .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .toolbar>.btn,.toolbar>button{width:100%;min-height:44px;white-space:normal;line-height:1.25;padding:10px 8px}
  .toolbar>input,.toolbar>select{grid-column:1/-1;width:100%;min-height:44px}
  .section-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .section-title>div{flex:1 1 100%;min-width:0}
  .section-title>.btn,.section-title>button{flex:1 1 100%;width:100%;min-height:42px}
  .card>.btn,.card>button.btn{max-width:100%;white-space:normal;line-height:1.25}
  .product-foot{flex-wrap:wrap;gap:9px}
  .product-foot>.btn,.product-foot>button{width:100%;min-height:42px}
  .modal-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .modal-actions>.btn,.modal-actions>button{width:100%;min-width:0;min-height:44px;white-space:normal;line-height:1.25;padding:10px 8px}
  .modal-actions>.btn:only-child,.modal-actions>button:only-child{grid-column:1/-1}
  .table-wrap .btn.small{min-height:36px;padding:7px 9px;white-space:nowrap}
  .mobile-nav button{flex:1;min-width:0;min-height:52px;padding:6px 1px;font-size:10px}
}
@media(max-width:380px){
  .toolbar{grid-template-columns:1fr}
  .toolbar>.btn,.toolbar>button{grid-column:1/-1}
  .modal-actions{grid-template-columns:1fr}
  .modal-actions>.btn,.modal-actions>button{grid-column:1/-1}
  .mobile-nav button{font-size:9px}
}


/* Corrección de desbordamiento y jerarquía en móviles */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.app,.main,.content,.page,.card,.stats,.layout2{min-width:0;max-width:100%}
@media(max-width:700px){
  .app{width:100%;overflow-x:hidden}
  .main{width:100%;min-width:0;overflow-x:hidden}
  .topbar{width:100%;min-width:0;max-width:100%;padding:0 12px;gap:8px}
  .topbar>div,.user{min-width:0;max-width:100%}
  .user{display:flex;align-items:center;gap:7px}
  .user>span{font-size:10px;white-space:nowrap}
  .user select{max-width:112px;min-width:0;padding:7px 5px!important;font-size:11px!important}
  .content{width:100%;max-width:100%;min-width:0;padding:18px 12px;overflow-x:hidden}
  .page-head{width:100%;min-width:0}
  .page-head h2{overflow-wrap:anywhere}
  .page-head>.btn,.page-head button{width:100%;max-width:100%;min-width:0;white-space:normal}
  .stats{display:grid;grid-template-columns:minmax(0,1fr);width:100%;gap:10px}
  .stats>.card{width:100%;min-width:0;margin:0}
  .card{min-width:0;max-width:100%;overflow-wrap:anywhere}
  .layout2,.table-grid,.menu-grid,.kitchen-grid{min-width:0;max-width:100%}
  .table-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .table-tile{min-width:0;max-width:100%}
  .toolbar{width:100%;min-width:0}
  .toolbar>*{min-width:0;max-width:100%}
  .section-title>*{min-width:0;max-width:100%}
  .mobile-nav{width:100%;max-width:100%;left:0;right:0}
  .modal-back{width:100%;max-width:100%;overflow-x:hidden}
  .modal{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
  .modal input,.modal select,.modal textarea{max-width:100%;min-width:0}
}
@media(max-width:380px){
  .content{padding-left:10px;padding-right:10px}
  .table-grid{grid-template-columns:minmax(0,1fr)}
  .user>span{display:none}
}

<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">LC</div><h1>LA CAVA</h1><p>COPAS Y TABLAS</p></div>
 <nav class="nav" id="sideNav">
  <button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
  <button data-page="mesas"><span class="ico">▦</span>Mesas</button>
  <button data-page="pedidos"><span class="ico">＋</span>Pedidos</button>
  <button data-page="preparacion"><span class="ico">♨</span>Preparación</button>
  <button data-page="menu"><span class="ico">☷</span>Menú y productos</button>
  <button data-page="caja"><span class="ico">＄</span>Caja</button>
  <button data-page="arqueo"><span class="ico">▣</span>Arqueo de caja</button>
  <button data-page="inventario"><span class="ico">▤</span>Inventario</button>
  <button data-page="informes"><span class="ico">▥</span>Informes</button>
  <button data-page="usuarios"><span class="ico">♙</span>Usuarios y roles</button>
 </nav>
 <div class="side-foot">Demo interactiva · Datos de ejemplo<br>La Cava © 2026</div>
</aside>
<main class="main">
 <header class="topbar"><div><div class="crumb">La Cava / <strong id="crumb">Dashboard</strong></div></div><div class="user"><span>● Servicio de hoy</span><select aria-label="Simular rol" id="roleSimulator" onchange="switchRole(this.value)" style="border:1px solid var(--line);border-radius:8px;padding:7px;background:white;font-size:12px"><option>Administrador</option><option>Cajero</option><option>Mesero</option></select><div class="avatar" id="roleAvatar">AD</div></div></header>
 <div class="content" id="view"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav">
 <button class="active" data-page="dashboard"><span>⌂</span>Inicio</button><button data-page="mesas"><span>▦</span>Mesas</button><button data-page="pedidos"><span>＋</span>Pedidos</button><button data-page="preparacion"><span>♨</span>Preparación</button><button data-page="caja"><span>＄</span>Caja</button><button data-page="arqueo"><span>▣</span>Arqueo</button><button data-page="usuarios"><span>♙</span>Usuarios</button>
</nav>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<script>
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
let page='dashboard', selectedTable=1, nextOrder=105, nextInvoice=1;
let tables=Array.from({length:12},(_,i)=>({id:i+1,people:0,status:'Disponible',waiter:'—',orders:[]}));
let products=[
{id:1,name:'Tabla La Cava',cat:'Tablas',price:58000,emoji:'🧀',desc:'Selección de quesos y charcutería',stock:true},
{id:2,name:'Tabla para dos',cat:'Tablas',price:42000,emoji:'🥖',desc:'Para compartir',stock:true},
{id:3,name:'Copa de vino tinto',cat:'Vinos',price:18000,emoji:'🍷',desc:'Copa de la casa',stock:true},
{id:4,name:'Vino botella',cat:'Vinos',price:95000,emoji:'🍾',desc:'Selección de la casa',stock:true},
{id:5,name:'Cóctel de frutos rojos',cat:'Cócteles',price:26000,emoji:'🍹',desc:'Preparación de la casa',stock:true},
{id:6,name:'Limonada natural',cat:'Bebidas',price:12000,emoji:'🍋',desc:'Natural y refrescante',stock:true},
{id:7,name:'Agua',cat:'Bebidas',price:6000,emoji:'💧',desc:'Agua personal',stock:true},
{id:8,name:'Postre de la casa',cat:'Postres',price:16000,emoji:'🍰',desc:'Porción individual',stock:true}
];
let orders=[
{id:101,table:2,waiter:'Laura',items:[{product:1,qty:1,note:''},{product:3,qty:2,note:''}],status:'En preparación',time:'7:42 p. m.',createdAt:new Date().toISOString(),paid:false},
{id:102,table:5,waiter:'Andrés',items:[{product:5,qty:2,note:'Sin hielo'}],status:'Listo',time:'7:48 p. m.',createdAt:new Date().toISOString(),paid:false},
{id:103,table:8,waiter:'Laura',items:[{product:2,qty:1,note:''},{product:6,qty:1,note:''}],status:'Pendiente',time:'7:51 p. m.',createdAt:new Date().toISOString(),paid:false}
];
let stock=[{name:'Vino tinto',unit:'Botellas',qty:18,min:5},{name:'Queso madurado',unit:'Porciones',qty:24,min:8},{name:'Fresas',unit:'Gramos',qty:900,min:300},{name:'Agua',unit:'Unidades',qty:32,min:10}];
let cashShift={opened:false,base:0,movements:[],closed:false,count:{}};
let appUsers=[
 {id:1,name:'Administrador Demo',username:'admin',role:'Administrador',active:true},
 {id:2,name:'Laura Gómez',username:'laura',role:'Mesero',active:true},
 {id:3,name:'Andrés Rojas',username:'andres',role:'Mesero',active:true},
 {id:4,name:'Camila Torres',username:'camila',role:'Cajero',active:true}
];
let activeRole='Administrador';

const denominations=[100000,50000,20000,10000,5000,2000,1000,500,200,100,50];

function totalOrder(o){return o.items.reduce((s,i)=>s+(products.find(p=>p.id===i.product)?.price||0)*i.qty,0)}
function tableTotal(id){return orders.filter(o=>o.table===id&&!o.paid).reduce((s,o)=>s+totalOrder(o),0)}
function syncTables(){tables.forEach(t=>{let os=orders.filter(o=>o.table===t.id&&!o.paid);t.orders=os;t.status=os.length?'Ocupada':'Disponible';t.waiter=os.at(-1)?.waiter||'—'})}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=({dashboard:'Dashboard',mesas:'Mesas',pedidos:'Pedidos',preparacion:'Preparación',menu:'Menú y productos',caja:'Caja',arqueo:'Arqueo de caja',inventario:'Inventario',informes:'Informes',usuarios:'Usuarios y roles'})[p];render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function head(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">La Cava · Copas y tablas</div><h2>${title}</h2><p class="sub">${sub}</p></div>${action}</div>`}
function render(){syncTables();let v=document.getElementById('view');({dashboard:dash,mesas:renderTables,pedidos:renderOrders,preparacion:renderKitchen,menu:renderMenu,caja:renderCash,arqueo:renderArqueo,inventario:renderInventory,informes:renderReports,usuarios:renderUsers})[page](v)}
function dash(v){let active=orders.filter(o=>!o.paid).length, sales=orders.filter(o=>o.paid).reduce((s,o)=>s+totalOrder(o),0)+426000;v.innerHTML=head('Resumen del servicio','Una vista rápida de la operación de hoy',`<button class="btn primary" onclick="openOrder()">＋ Nuevo pedido</button>`)+`
<div class="grid stats"><div class="card"><div class="stat-label">Ventas del día</div><div class="stat-value">${money(sales)}</div><div class="stat-note">Dato ilustrativo de la demo</div></div><div class="card"><div class="stat-label">Pedidos activos</div><div class="stat-value">${active}</div><div class="stat-note">En todas las mesas</div></div><div class="card"><div class="stat-label">Mesas ocupadas</div><div class="stat-value">${tables.filter(t=>t.status==='Ocupada').length} / ${tables.length}</div><div class="stat-note">Mesas en servicio</div></div><div class="card"><div class="stat-label">Por cobrar</div><div class="stat-value">${money(orders.filter(o=>!o.paid).reduce((s,o)=>s+totalOrder(o),0))}</div><div class="stat-note">Cuentas abiertas</div></div></div>
<div class="grid layout2"><section class="card"><div class="section-title"><h3>Estado de las mesas</h3><button class="btn small" onclick="go('mesas')">Ver todas</button></div><div class="grid table-grid">${tables.slice(0,8).map(t=>`<button class="table-tile ${t.status==='Ocupada'?'occupied':''}" onclick="openTable(${t.id})"><span class="pill ${t.status==='Ocupada'?'busy':''}">${t.status}</span><span class="num">Mesa ${t.id}</span><span class="meta">${t.orders.length? t.orders.length+' pedido(s) · '+money(tableTotal(t.id)):'Disponible'}</span></button>`).join('')}</div></section>
<section class="card"><div class="section-title"><h3>Actividad reciente</h3><button class="btn small" onclick="go('preparacion')">Ver comandas</button></div><div class="list">${orders.slice().reverse().slice(0,5).map(o=>`<div class="order-row"><div><strong>Pedido #${o.id} · Mesa ${o.table}</strong><small>${o.waiter} · ${o.time} · ${o.status}</small></div><span class="money">${money(totalOrder(o))}</span></div>`).join('')}</div></section></div>`}

function openOrder(tableId){let id=tableId||null, cart=[];let cats=['Todos',...new Set(products.map(p=>p.cat))],cat='Todos';function draw(){let pList=products.filter(p=>p.stock&&(cat==='Todos'||p.cat===cat));document.getElementById('orderBody').innerHTML=`<div class="field"><label>Mesa</label><select id="orderTable">${tables.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>Mesa ${t.id}${t.status==='Ocupada'?' · Ocupada':''}</option>`).join('')}</select></div><div class="tabs">${cats.map(c=>`<button class="tab ${cat===c?'active':''}" onclick="window._cat=${JSON.stringify(c)};window._drawOrder()">${c}</button>`).join('')}</div><div class="grid menu-grid">${pList.map(p=>`<div class="product"><div class="product-art">${p.emoji}</div><div class="product-body"><h4>${p.name}</h4><p>${p.desc}</p><div class="product-foot"><strong>${money(p.price)}</strong><button class="btn small" onclick="window._addCart(${p.id})">Agregar</button></div></div></div>`).join('')}</div><h4>Pedido actual</h4>${cart.length?cart.map((x,i)=>`<div class="cart-line"><span>${x.name}<br><small>${money(x.price)}</small></span><div class="qty"><button onclick="window._qty(${i},-1)">−</button>${x.qty}<button onclick="window._qty(${i},1)">+</button></div></div>`).join(''):'<div class="empty">Agrega productos al pedido.</div>'}<div class="total-line"><span>Total del pedido</span><span>${money(cart.reduce((s,x)=>s+x.price*x.qty,0))}</span></div><div class="field"><label>Mesero que atiende</label><select id="orderWaiter"><option>Laura</option><option>Andrés</option><option>Camila</option><option>Juan</option></select></div><div class="field"><label>Observación general (opcional)</label><input id="orderNote" placeholder="Ej. atender primero las bebidas"></div>`}
window._drawOrder=draw;window._addCart=id=>{let p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id:p.id,name:p.name,price:p.price,qty:1});draw()};window._qty=(i,n)=>{cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);draw()};

function renderCash(v){let open=orders.filter(o=>!o.paid);v.innerHTML=head('Caja y cuentas','Revisa con el cliente el detalle de lo consumido en cada mesa antes de cobrar')+`<div class="grid stats"><div class="card"><div class="stat-label">Cuentas abiertas</div><div class="stat-value">${tables.filter(t=>tableTotal(t.id)>0).length}</div></div><div class="card"><div class="stat-label">Total por cobrar</div><div class="stat-value">${money(open.reduce((s,o)=>s+totalOrder(o),0))}</div></div><div class="card"><div class="stat-label">Modalidad</div><div class="stat-value" style="font-size:18px">Pago al finalizar</div></div><div class="card"><div class="stat-label">Medios habilitados</div><div class="stat-value" style="font-size:18px">Efectivo · Transferencia · Datáfono</div></div></div><div class="grid table-grid">${tables.filter(t=>tableTotal(t.id)>0).map(t=>{let os=orders.filter(o=>o.table===t.id&&!o.paid),items=os.flatMap(o=>o.items),qtyByProduct={};items.forEach(i=>qtyByProduct[i.product]=(qtyByProduct[i.product]||0)+i.qty);return `<div class="card"><span class="pill busy">Cuenta abierta</span><h3>Mesa ${t.id}</h3><p class="sub">${os.length} pedido(s) · ${items.reduce((a,i)=>a+i.qty,0)} producto(s)</p><div style="margin:12px 0"><strong style="font-size:12px">Consumo de la mesa</strong>${Object.entries(qtyByProduct).map(([pid,qty])=>{let p=products.find(x=>x.id===Number(pid));return `<div class="order-row"><span>${qty} × ${p?.name||'Producto'}</span><strong>${money((p?.price||0)*qty)}</strong></div>`}).join('')}</div><div class="total-line"><span>Total</span><span>${money(tableTotal(t.id))}</span></div><button class="btn" style="width:100%;margin-bottom:8px" onclick="openTable(${t.id})">Ver detalle completo</button><button class="btn primary" style="width:100%" onclick="payTable(${t.id})">Cobrar cuenta</button></div>`}).join('')||'<div class="card empty">No hay cuentas pendientes.</div>'}</div>`}
function payTable(id){let due=tableTotal(id);if(!due){alert('La mesa no tiene saldo pendiente');return}showModal(`<div class="modal-head"><h3>Cobrar mesa ${id}</h3><button class="close" onclick="closeModal()">×</button></div><div class="total-line"><span>Total a pagar</span><span>${money(due)}</span></div><div class="field"><label>Medio de pago</label><select id="payMethod"><option>Efectivo</option><option>Transferencia</option><option>Datáfono</option></select></div><div class="field" id="cashField"><label>Valor recibido</label><input id="cashReceived" type="number" value="${due}" oninput="calcChange(${due})"></div><div class="notice" id="changeBox">Vueltas: ${money(0)}</div><div class="field hide" id="approvalField"><label>Número de aprobación del datáfono *</label><input id="approvalNumber" maxlength="40" placeholder="Ej. 845921"></div><div class="field"><label>Nombre del cliente (opcional)</label><input id="customerName" placeholder="Nombre o razón social"></div><div class="field"><label>Documento / NIT (opcional)</label><input id="customerDoc" placeholder="CC o NIT"></div><div class="field"><label>Correo electrónico (opcional)</label><input id="customerEmail" type="email" placeholder="cliente@correo.com"></div><div class="notice">Se generará un comprobante de venta de demostración. No es una factura electrónica validada por la DIAN.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmPay(${id})">Confirmar pago y generar comprobante</button></div>`);document.getElementById('payMethod').addEventListener('change',e=>{let cash=e.target.value==='Efectivo',card=e.target.value==='Datáfono';document.getElementById('cashField').classList.toggle('hide',!cash);document.getElementById('changeBox').classList.toggle('hide',!cash);document.getElementById('approvalField').classList.toggle('hide',!card)})}
function calcChange(due){let n=Number(document.getElementById('cashReceived').value)||0;document.getElementById('changeBox').textContent='Vueltas: '+money(Math.max(0,n-due))}
function confirmPay(id){let method=document.getElementById('payMethod').value,due=tableTotal(id),approval=document.getElementById('approvalNumber')?.value.trim()||'';if(method==='Efectivo'&&Number(document.getElementById('cashReceived').value)<due){alert('El valor recibido no alcanza para cubrir la cuenta.');return}if(method==='Datáfono'&&!approval){alert('Ingresa el número de aprobación del datáfono.');return}let customer={name:document.getElementById('customerName').value.trim(),doc:document.getElementById('customerDoc').value.trim(),email:document.getElementById('customerEmail').value.trim()},invoiceNo='LC-'+String(new Date().getFullYear())+'-'+String(nextInvoice++).padStart(5,'0'),paidAt=new Date().toISOString();orders.filter(o=>o.table===id&&!o.paid).forEach(o=>{o.paid=true;o.status='Cerrado';o.payment=method;o.approvalNumber=method==='Datáfono'?approval:'';o.customer={...customer};o.invoiceNo=invoiceNo;o.paidAt=paidAt});closeModal();go('caja');setTimeout(()=>{if(confirm('Pago registrado. ¿Deseas imprimir el comprobante de venta de demostración?'))printInvoice(id)},50)}
function printInvoice(invoiceNo){let same=orders.filter(o=>o.paid&&o.invoiceNo===invoiceNo);if(!same.length){alert('No se encontró el comprobante.');return}let invoice=same[0],total=same.reduce((a,o)=>a+totalOrder(o),0),items=same.flatMap(o=>o.items),lines=items.map(i=>{let pr=products.find(p=>p.id===i.product);return `<tr><td>${i.qty}</td><td>${pr?.name||'Producto'}</td><td>${money((pr?.price||0)*i.qty)}</td></tr>`}).join('');let w=window.open('','_blank','width=520,height=720');if(!w){alert('Permite ventanas emergentes para imprimir.');return}w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Comprobante ${invoice.invoiceNo}</title><style>body{font:13px Arial;padding:24px;color:#222}h1,h2{text-align:center}h1{letter-spacing:3px}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;font-size:18px;font-weight:bold;margin-top:18px}.muted{color:#666;font-size:11px;text-align:center;margin-top:24px}</style></head><body><h1>LA CAVA</h1><h2>COMPROBANTE DE VENTA · DEMO</h2><p><b>Número:</b> ${invoice.invoiceNo}</p><p><b>Fecha:</b> ${new Date(invoice.paidAt).toLocaleString('es-CO')}</p><p><b>Mesa:</b> ${invoice.table}</p><p><b>Cliente:</b> ${invoice.customer?.name||'Consumidor final'}</p><p><b>Documento:</b> ${invoice.customer?.doc||'No informado'}</p><p><b>Correo:</b> ${invoice.customer?.email||'No informado'}</p><p><b>Medio de pago:</b> ${invoice.payment}</p>${invoice.approvalNumber?`<p><b>Aprobación datáfono:</b> ${invoice.approvalNumber}</p>`:''}<table><thead><tr><th>Cant.</th><th>Descripción</th><th>Valor</th></tr></thead><tbody>${lines}</tbody></table><div class="total">Total: ${money(total)}</div><p class="muted">Documento ilustrativo de demostración. No es factura electrónica, no tiene CUFE ni validación DIAN.</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}

function shiftExpected(){let sales=orders.filter(o=>o.paid&&o.payment==='Efectivo').reduce((s,o)=>s+totalOrder(o),0);let moves=cashShift.movements.reduce((s,m)=>s+(m.type==='Entrada'?m.amount:-m.amount),0);return cashShift.base+sales+moves}
function renderArqueo(v){
 let expected=shiftExpected(),counted=denominations.reduce((s,d)=>s+d*(Number(cashShift.count[d])||0),0),diff=counted-expected;
 v.innerHTML=head('Arqueo y cierre de caja','Controla la base inicial, movimientos y efectivo contado')+
 `<div class="grid stats"><div class="card"><div class="stat-label">Estado del turno</div><div class="stat-value" style="font-size:20px">${cashShift.opened?'Abierto':cashShift.closed?'Cerrado':'Sin apertura'}</div><div class="stat-note">${cashShift.opened?'Caja en operación':'Registra una apertura para comenzar'}</div></div><div class="card"><div class="stat-label">Base inicial</div><div class="stat-value">${money(cashShift.base)}</div></div><div class="card"><div class="stat-label">Efectivo esperado</div><div class="stat-value">${money(expected)}</div></div><div class="card"><div class="stat-label">Efectivo contado</div><div class="stat-value">${money(counted)}</div></div></div>
 <div class="grid layout2"><section class="card"><div class="section-title"><h3>Apertura y movimientos</h3>${cashShift.opened?'<span class="pill">Turno abierto</span>':'<span class="pill danger">Turno sin abrir</span>'}</div>
 ${!cashShift.opened&&!cashShift.closed?`<div class="field"><label>Base inicial de caja (COP)</label><input id="openingBase" type="number" min="0" placeholder="Ej. 200000"></div><button class="btn primary" onclick="openCashShift()">Abrir caja</button>`:cashShift.opened?`<button class="btn" onclick="cashMovement()">＋ Registrar entrada / salida</button>`:`<p class="sub">El turno está cerrado. Inicia un nuevo turno para continuar.</p><button class="btn primary" onclick="newCashShift()">Abrir nuevo turno</button>`}
 <div style="margin-top:18px"><h3 style="font:600 17px Georgia,serif">Movimientos de caja</h3>${cashShift.movements.length?cashShift.movements.map(m=>`<div class="order-row"><div><strong>${m.type}: ${m.reason}</strong><small>${m.time}</small></div><span class="money">${m.type==='Entrada'?'+':'−'}${money(m.amount)}</span></div>`).join(''):'<div class="empty">No hay movimientos registrados.</div>'}</div></section>
 <section class="card"><div class="section-title"><h3>Resumen del turno</h3></div><div class="order-row"><span>Base inicial</span><strong>${money(cashShift.base)}</strong></div><div class="order-row"><span>Ventas en efectivo</span><strong>${money(orders.filter(o=>o.paid&&o.payment==='Efectivo').reduce((s,o)=>s+totalOrder(o),0))}</strong></div><div class="order-row"><span>Entradas de caja</span><strong>${money(cashShift.movements.filter(m=>m.type==='Entrada').reduce((s,m)=>s+m.amount,0))}</strong></div><div class="order-row"><span>Salidas de caja</span><strong>${money(cashShift.movements.filter(m=>m.type==='Salida').reduce((s,m)=>s+m.amount,0))}</strong></div><div class="total-line"><span>Efectivo esperado</span><span>${money(expected)}</span></div><div class="notice">El efectivo esperado considera base inicial, ventas pagadas en efectivo y movimientos registrados. Transferencias y datáfono no se suman al efectivo físico.</div></section></div>
 <section class="card" style="margin-top:16px"><div class="section-title"><div><h3>Conteo de efectivo por denominación</h3><p class="sub">Ingresa cuántos billetes y monedas tienes físicamente.</p></div><button class="btn small" onclick="clearCashCount()">Limpiar conteo</button></div><div class="table-wrap"><table><thead><tr><th>Denominación</th><th>Cantidad</th><th>Subtotal</th></tr></thead><tbody>${denominations.map(d=>`<tr><td><strong>${money(d)}</strong></td><td><input aria-label="Cantidad ${d}" type="number" min="0" inputmode="numeric" style="width:90px;padding:8px;border:1px solid var(--line);border-radius:7px" value="${cashShift.count[d]||''}" onchange="setCashCount(${d},this.value)" placeholder="0"></td><td><strong>${money(d*(Number(cashShift.count[d])||0))}</strong></td></tr>`).join('')}</tbody></table></div><div class="grid stats" style="margin-top:15px"><div class="card"><div class="stat-label">Total contado</div><div class="stat-value">${money(counted)}</div></div><div class="card"><div class="stat-label">Efectivo esperado</div><div class="stat-value">${money(expected)}</div></div><div class="card"><div class="stat-label">Diferencia</div><div class="stat-value" style="color:${diff===0?'#3f7454':diff<0?'#b84d43':'#96651e'}">${money(diff)}</div></div><div class="card"><div class="stat-label">Resultado</div><div class="stat-value" style="font-size:18px">${diff===0?'Cuadre exacto':diff<0?'Faltante':'Sobrante'}</div></div></div>${cashShift.opened?`<div class="modal-actions"><button class="btn gold" onclick="closeCashShift()">Realizar cierre de caja</button></div>`:''}</section>`;
}
function openCashShift(){let n=Number(document.getElementById('openingBase').value);if(n<0||!Number.isFinite(n)){alert('Ingresa una base inicial válida');return}cashShift={opened:true,closed:false,base:n,movements:[],count:{}};render()}
function newCashShift(){cashShift={opened:false,closed:false,base:0,movements:[],count:{}};render()}
function cashMovement(){showModal(`<div class="modal-head"><h3>Movimiento de caja</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Tipo de movimiento</label><select id="moveType"><option>Entrada</option><option>Salida</option></select></div><div class="field"><label>Concepto</label><input id="moveReason" placeholder="Ej. compra urgente de insumos"></div><div class="field"><label>Valor (COP)</label><input id="moveAmount" type="number" min="1"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCashMovement()">Guardar movimiento</button></div>`)}
function saveCashMovement(){let amount=Number(document.getElementById('moveAmount').value),reason=document.getElementById('moveReason').value.trim(),type=document.getElementById('moveType').value;if(amount<=0||!reason){alert('Completa el concepto y un valor válido.');return}cashShift.movements.push({type,amount,reason,time:new Date().toLocaleString('es-CO')});closeModal();render()}
function setCashCount(d,v){cashShift.count[d]=Math.max(0,Number(v)||0);render()}
function clearCashCount(){cashShift.count={};render()}
function closeCashShift(){let expected=shiftExpected(),counted=denominations.reduce((s,d)=>s+d*(Number(cashShift.count[d])||0),0),diff=counted-expected;if(!confirm(`¿Confirmas el cierre de caja?\nEfectivo esperado: ${money(expected)}\nEfectivo contado: ${money(counted)}\nDiferencia: ${money(diff)}`))return;cashShift.opened=false;cashShift.closed=true;alert('Cierre de caja registrado en esta demostración.');render()}


function switchRole(role){
 activeRole=role;
 document.getElementById('roleAvatar').textContent=role==='Administrador'?'AD':role==='Cajero'?'CJ':'ME';
 // Simulación de perfil para explorar la demo; la autorización real se implementará en backend.
 const allowed={Administrador:['dashboard','mesas','pedidos','preparacion','menu','caja','arqueo','inventario','informes','usuarios'],Cajero:['dashboard','mesas','pedidos','caja','arqueo'],Mesero:['mesas','pedidos','preparacion']}[role];
 document.querySelectorAll('#sideNav [data-page]').forEach(b=>b.classList.toggle('hide',!allowed.includes(b.dataset.page)));
 const mobileItems={
  Administrador:[['dashboard','⌂','Inicio'],['mesas','▦','Mesas'],['pedidos','＋','Pedidos'],['caja','＄','Caja'],['arqueo','▣','Arqueo'],['informes','▥','Informes']],
  Cajero:[['dashboard','⌂','Inicio'],['mesas','▦','Cuentas'],['caja','＄','Caja'],['arqueo','▣','Arqueo']],
  Mesero:[['mesas','▦','Mesas'],['pedidos','＋','Pedidos'],['preparacion','♨','Preparación']]
 }[role];
 document.getElementById('mobileNav').innerHTML=mobileItems.map(([p,icon,label])=>`<button data-page="${p}" class="${page===p?'active':''}"><span>${icon}</span>${label}</button>`).join('');
 document.querySelectorAll('#mobileNav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
 if(!allowed.includes(page))go(allowed[0]); else go(page);
}
function renderUsers(v){
 const roles=[
  {name:'Administrador',icon:'🛡️',desc:'Control completo del negocio, configuración y supervisión.',perms:'Dashboard · Usuarios · Productos · Mesas · Inventario · Caja · Arqueo · Informes'},
  {name:'Cajero',icon:'💳',desc:'Gestiona cuentas, cobros, apertura y cierre de caja.',perms:'Mesas · Cuentas · Pagos · Caja · Arqueo'},
  {name:'Mesero',icon:'🍽️',desc:'Atiende cualquier mesa y registra pedidos.',perms:'Mesas · Pedidos · Comandas · Entregas'}
 ];
 v.innerHTML=head('Usuarios y roles','Administra los accesos y responsabilidades del equipo',`<button class="btn primary" onclick="newAppUser()">＋ Crear usuario</button>`)+
 `<div class="grid menu-grid" style="margin-bottom:18px">${roles.map(r=>`<div class="card"><div style="font-size:27px">${r.icon}</div><h3 style="font:600 19px Georgia,serif;margin:8px 0">${r.name}</h3><p class="sub">${r.desc}</p><div class="notice">${r.perms}</div></div>`).join('')}</div>
 <div class="card"><div class="section-title"><div><h3>Equipo de La Cava</h3><p class="sub">Usuarios registrados en la demostración</p></div><span class="pill">${appUsers.filter(u=>u.active).length} activos</span></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${appUsers.map(u=>`<tr><td><strong>${u.name}</strong></td><td>${u.username}</td><td><span class="pill">${u.role}</span></td><td><span class="pill ${u.active?'':'danger'}">${u.active?'Activo':'Inactivo'}</span></td><td><button class="btn small" onclick="toggleAppUser(${u.id})">${u.active?'Desactivar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div><div class="notice">La selección de rol en la barra superior permite simular las vistas de cada perfil. La autenticación y el control de permisos definitivo se implementarán en el backend.</div></div>`;
}
function newAppUser(){
 showModal(`<div class="modal-head"><h3>Crear usuario</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Nombre completo</label><input id="uName" placeholder="Nombre del empleado"></div><div class="field"><label>Nombre de usuario</label><input id="uLogin" placeholder="Ej. maria"></div><div class="field"><label>Rol</label><select id="uRole"><option>Mesero</option><option>Cajero</option><option>Administrador</option></select></div><div class="notice">La contraseña y recuperación de acceso se configurarán cuando conectemos el módulo de autenticación.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAppUser()">Crear usuario</button></div>`);
}
function saveAppUser(){
 let name=document.getElementById('uName').value.trim(),username=document.getElementById('uLogin').value.trim(),role=document.getElementById('uRole').value;
 if(!name||!username){alert('Completa nombre y usuario');return}
 if(appUsers.some(u=>u.username.toLowerCase()===username.toLowerCase())){alert('Ese nombre de usuario ya existe');return}
 appUsers.push({id:Math.max(0,...appUsers.map(u=>u.id))+1,name,username,role,active:true});closeModal();render();
}
function toggleAppUser(id){let u=appUsers.find(x=>x.id===id);u.active=!u.active;render()}

function renderInventory(v){v.innerHTML=head('Inventario','Control básico de existencias e insumos',`<button class="btn primary" onclick="stockMove()">＋ Registrar movimiento</button>`)+`<div class="table-wrap"><table><thead><tr><th>Insumo</th><th>Unidad</th><th>Existencia</th><th>Mínimo</th><th>Estado</th></tr></thead><tbody>${stock.map(s=>`<tr><td><strong>${s.name}</strong></td><td>${s.unit}</td><td>${s.qty}</td><td>${s.min}</td><td><span class="pill ${s.qty<=s.min?'danger':''}">${s.qty<=s.min?'Stock bajo':'Disponible'}</span></td></tr>`).join('')}</tbody></table></div><div class="notice">En esta demo el inventario es manual. El descuento automático por recetas se contempla para una siguiente fase.</div>`}
function stockMove(){showModal(`<div class="modal-head"><h3>Movimiento de inventario</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Insumo</label><select id="stockName">${stock.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select id="stockType"><option value="1">Entrada</option><option value="-1">Salida / merma</option></select></div><div class="field"><label>Cantidad</label><input id="stockQty" type="number" min="1"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveStock()">Guardar</button></div>`)}
function saveStock(){let s=stock.find(x=>x.name===document.getElementById('stockName').value),q=Number(document.getElementById('stockQty').value),t=Number(document.getElementById('stockType').value);if(q<=0){alert('Cantidad inválida');return}if(s.qty+q*t<0){alert('No hay existencias suficientes');return}s.qty+=q*t;closeModal();render()}

function monthKey(d){let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`}
function monthLabel(key){let [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'})}
function monthOrders(key){return orders.filter(o=>monthKey(o.createdAt||new Date().toISOString())===key)}
function monthlySummary(key){
 let list=monthOrders(key),paid=list.filter(o=>o.paid),pending=list.filter(o=>!o.paid);
 return {list,paid,pending,total:list.reduce((s,o)=>s+totalOrder(o),0),paidTotal:paid.reduce((s,o)=>s+totalOrder(o),0),pendingTotal:pending.reduce((s,o)=>s+totalOrder(o),0)};
}
function renderReports(v){
 let key=window.reportMonth||new Date().toISOString().slice(0,7),s=monthlySummary(key);
 v.innerHTML=head('Informes y cuentas del mes','Consulta ventas, cobros y saldos pendientes por período',`<button class="btn primary" onclick="exportMonthlyExcel()">⇩ Exportar Excel</button>`)+
 `<div class="card" style="margin-bottom:16px"><div class="toolbar" style="align-items:center;margin:0"><label for="reportMonth" style="font-size:12px;font-weight:700">Mes del informe</label><input id="reportMonth" type="month" value="${key}" onchange="window.reportMonth=this.value;render()"><span class="sub">${monthLabel(key)}</span></div></div>
 <div class="grid stats"><div class="card"><div class="stat-label">Total de cuentas / pedidos</div><div class="stat-value">${s.list.length}</div><div class="stat-note">Registros del mes seleccionado</div></div><div class="card"><div class="stat-label">Valor total generado</div><div class="stat-value">${money(s.total)}</div><div class="stat-note">Consumo registrado</div></div><div class="card"><div class="stat-label">Total recaudado</div><div class="stat-value">${money(s.paidTotal)}</div><div class="stat-note">Cuentas pagadas</div></div><div class="card"><div class="stat-label">Saldo pendiente</div><div class="stat-value">${money(s.pendingTotal)}</div><div class="stat-note">Cuentas aún abiertas</div></div></div>
 <div class="grid layout2"><section class="card"><div class="section-title"><h3>Resumen mensual</h3><span class="pill">${monthLabel(key)}</span></div><div class="order-row"><span>Consumo total registrado</span><strong>${money(s.total)}</strong></div><div class="order-row"><span>Pagos recibidos</span><strong>${money(s.paidTotal)}</strong></div><div class="order-row"><span>Saldo por cobrar</span><strong>${money(s.pendingTotal)}</strong></div><div class="order-row"><span>Cuentas pagadas</span><strong>${s.paid.length}</strong></div><div class="order-row"><span>Cuentas pendientes</span><strong>${s.pending.length}</strong></div><div class="notice">El resumen agrupa los pedidos por mes de creación y calcula los saldos con base en los pedidos pagados y pendientes.</div></section>
 <section class="card"><div class="section-title"><h3>Ventas por medio de pago</h3></div>${['Efectivo','Transferencia','Datáfono'].map(m=>{let val=s.paid.filter(o=>o.payment===m).reduce((a,o)=>a+totalOrder(o),0);return `<div class="order-row"><span>${m}</span><strong>${money(val)}</strong></div>`}).join('')}<div class="notice">Los importes son ilustrativos y corresponden a los movimientos realizados en esta sesión de demo.</div></section></div>
 <section class="card" style="margin-top:16px"><div class="section-title"><div><h3>Detalle de cuentas del mes</h3><p class="sub">Cada pedido se incluye dentro de la cuenta de su mesa.</p></div><button class="btn small" onclick="exportMonthlyExcel()">Exportar Excel</button></div><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Mesa</th><th>Mesero</th><th>Fecha</th><th>Estado de cuenta</th><th>Medio de pago</th><th>Aprobación datáfono</th><th>Comprobante</th><th>Total</th></tr></thead><tbody>${s.list.length?s.list.map(o=>`<tr><td>#${o.id}</td><td>Mesa ${o.table}</td><td>${o.waiter}</td><td>${new Date(o.createdAt||Date.now()).toLocaleDateString('es-CO')}</td><td>${o.paid?'Pagada':'Pendiente'}</td><td>${o.payment||'—'}</td><td>${o.approvalNumber||'—'}</td><td>${o.invoiceNo?`<button class="btn small" onclick="printInvoice('${o.invoiceNo}')">Imprimir</button>`:'—'}</td><td><strong>${money(totalOrder(o))}</strong></td></tr>` ).join(''):`<tr><td colspan="9" class="empty">No hay cuentas para este mes.</td></tr>`}</tbody></table></div></section>`;
}
function exportMonthlyExcel(){
 let key=window.reportMonth||new Date().toISOString().slice(0,7),s=monthlySummary(key);
 let rows=[['LA CAVA - REPORTE MENSUAL',monthLabel(key)],[],['Indicador','Valor'],['Pedidos / cuentas',s.list.length],['Consumo total',s.total],['Total recaudado',s.paidTotal],['Saldo pendiente',s.pendingTotal],[],['Pedido','Mesa','Mesero','Fecha','Estado','Medio de pago','Aprobación datáfono','Comprobante','Total'],
 ...s.list.map(o=>[o.id,'Mesa '+o.table,o.waiter,new Date(o.createdAt||Date.now()).toLocaleDateString('es-CO'),o.paid?'Pagada':'Pendiente',o.payment||'',o.approvalNumber||'',o.invoiceNo||'',totalOrder(o)])];
 let table=rows.map((r,i)=>'<tr>'+r.map(c=>`<${i===0||i===2||i===8?'th':'td'}>${String(c??'')}</${i===0||i===2||i===8?'th':'td'}>`).join('')+'</tr>').join('');
 let doc=`<html><head><meta charset="utf-8"></head><body><table>${table}</table></body></html>`;
 let blob=new Blob(['\ufeff'+doc],{type:'application/vnd.ms-excel;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`la-cava-reporte-${key}.xls`;a.click();URL.revokeObjectURL(url);
}
function exportCSV(){let rows=[['Pedido','Mesa','Mesero','Estado','Pago','Total'],...orders.map(o=>[o.id,o.table,o.waiter,o.status,o.payment||'Pendiente',totalOrder(o)])];let csv=rows.map(r=>r.join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='la-cava-pedidos.csv';a.click();URL.revokeObjectURL(a.href)}

function printOrder(id){
 let o=orders.find(x=>x.id===id);if(!o)return;
 let lines=o.items.map(i=>{let p=products.find(x=>x.id===i.product);return `<tr><td>${i.qty}</td><td>${p?.name||'Producto'}</td><td>${i.note||''}</td></tr>`}).join('');
 let w=window.open('','_blank','width=420,height=650');if(!w){alert('El navegador bloqueó la ventana de impresión. Permite ventanas emergentes e inténtalo de nuevo.');return}
 w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Comanda #${o.id}</title><style>body{font:14px Arial,sans-serif;padding:22px;color:#111}h1{font-size:20px;text-align:center;letter-spacing:2px}h2{text-align:center;font-size:16px}p{margin:5px 0}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:9px 4px;border-bottom:1px dashed #999;font-size:13px}.foot{text-align:center;margin-top:25px;font-size:11px}@media print{button{display:none}}</style></head><body><h1>LA CAVA</h1><h2>COMANDA DE PREPARACIÓN</h2><hr><p><b>Pedido:</b> #${o.id}</p><p><b>Mesa:</b> ${o.table}</p><p><b>Mesero:</b> ${o.waiter}</p><p><b>Hora:</b> ${o.time}</p><table><thead><tr><th>Cant.</th><th>Producto</th><th>Observación</th></tr></thead><tbody>${lines}</tbody></table><p class="foot">La Cava · Copas y Tablas</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();
}

function showModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
render();
switchRole('Administrador');
</script>
</body></html>
